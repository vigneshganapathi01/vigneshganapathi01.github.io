<text x="284" y="332" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1b140c" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">Which stores sold the most discounted</text>
<text x="284" y="362" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#1b140c" font-weight="600" text-anchor="start" letter-spacing="0" opacity="1">stock last month?</text>
<rect x="190" y="420" width="640" height="210" rx="14" fill="#0f0e0d" stroke="#2f2c28" stroke-width="1.5" opacity="1"/>
<text x="214" y="460" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" font-size="17"><tspan fill="#9fc3ff" font-weight="700">SELECT</tspan><tspan fill="#f3eee6"> store, SUM(qty) AS units</tspan></text>
<text x="214" y="494" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" font-size="17"><tspan fill="#9fc3ff" font-weight="700">FROM</tspan><tspan fill="#f3eee6"> sales s JOIN discounts d</tspan></text>
<text x="214" y="528" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" font-size="17"><tspan fill="#9fc3ff" font-weight="700">  ON</tspan><tspan fill="#f3eee6"> s.sku = d.sku</tspan></text>
<text x="214" y="562" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" font-size="17"><tspan fill="#9fc3ff" font-weight="700">WHERE</tspan><tspan fill="#f3eee6"> month = '2024-08'</tspan></text>
<text x="214" y="596" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, monospace" font-size="17"><tspan fill="#9fc3ff" font-weight="700">GROUP BY</tspan><tspan fill="#f3eee6"> store ORDER BY units DESC</tspan></text>
<rect x="190" y="660" width="640" height="180" rx="14" fill="#23201c" stroke="#2f2c28" stroke-width="1.5" opacity="1"/>
<text x="214" y="700" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f3eee6" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Store #12 (Gandhipuram) led with 1,284 units —</text>
<text x="214" y="728" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#f3eee6" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">31% above the next store. Discounts on</text>
